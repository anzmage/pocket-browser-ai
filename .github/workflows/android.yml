name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test agent with mock provider
        run: flutter test --reporter expanded
      - name: Test DOM observation and actions
        run: npm test
      - name: Build Android ARM debug APK
        run: flutter build apk --debug --target-platform android-arm64,android-arm
      - name: Upload APK, dependency lock and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/pocket-browser-ai-debug.apk
          cp pubspec.lock dist/
          cd dist
          sha256sum pocket-browser-ai-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-browser-ai-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
